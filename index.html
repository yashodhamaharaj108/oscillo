<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Oscillo — generative audio·visual instrument</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23cfc9ff' stroke-width='2'/%3E%3Cpath d='M6 16h4l2-6 4 12 3-9 2 3h5' fill='none' stroke='%23cfc9ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#eceaf4;
  --dim:rgba(236,234,244,.55);
  --faint:rgba(236,234,244,.32);
  --line:rgba(236,234,244,.14);
  --accent:#cfc9ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#08080d;color:var(--ink);
  font:400 16px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ── Menu ─────────────────────────────────────────── */
#menu{
  position:fixed;inset:0;z-index:10;overflow:auto;
  display:grid;place-items:center;
  background:#08080d;
  transition:opacity .55s ease,visibility .55s;
}
#menu.gone{opacity:0;visibility:hidden;pointer-events:none}
#menu::before,#menu::after{
  content:"";position:fixed;width:58vmax;height:58vmax;border-radius:50%;
  filter:blur(90px);opacity:.15;pointer-events:none;
}
#menu::before{
  background:radial-gradient(circle,#5643c9 0%,transparent 62%);
  top:-16vmax;left:-12vmax;animation:drift1 27s ease-in-out infinite alternate;
}
#menu::after{
  background:radial-gradient(circle,#1e7f74 0%,transparent 62%);
  bottom:-18vmax;right:-14vmax;animation:drift2 33s ease-in-out infinite alternate;
}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(14vw,10vh) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-12vw,-8vh) scale(.95)}}

.wrap{position:relative;max-width:980px;width:100%;padding:56px 28px 40px}
h1{
  font-size:clamp(38px,7vw,62px);font-weight:200;
  letter-spacing:.42em;text-indent:.42em;text-align:center;
}
.tag{
  text-align:center;color:var(--dim);font-size:14px;
  max-width:540px;margin:12px auto 46px;
}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px 40px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.cols h3{
  font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
  color:var(--faint);margin-bottom:14px;
}
.card{
  display:block;width:100%;text-align:left;
  padding:13px 16px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,.02);
  transition:background .18s,border-color .18s,transform .18s,box-shadow .18s;
}
.card:hover{background:rgba(255,255,255,.055);transform:translateY(-1px)}
.card.sel{
  border-color:rgba(207,201,255,.75);
  background:rgba(122,110,255,.10);
  box-shadow:0 0 0 1px rgba(207,201,255,.3),0 6px 28px -10px rgba(122,110,255,.5);
}
.card b{display:block;font-weight:600;font-size:15px}
.card span{font-size:12.5px;color:var(--dim)}
.go{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:42px}
#generate{
  padding:15px 56px;border-radius:999px;
  background:var(--ink);color:#0b0b12;
  font-weight:600;font-size:14px;letter-spacing:.18em;
  transition:transform .2s,box-shadow .2s,background .2s,color .2s;
}
#generate:disabled{background:transparent;color:var(--faint);border:1px solid var(--line);cursor:default}
#generate:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 32px -8px rgba(236,234,244,.5)}
#lucky{font-size:12.5px;color:var(--dim);text-decoration:underline dotted;text-underline-offset:3px}
#lucky:hover{color:var(--ink)}
.hint{font-size:12px;color:var(--faint);text-align:center;max-width:420px}

/* ── Stage ────────────────────────────────────────── */
#stage{position:fixed;inset:0;background:#000}
#stage.gone{display:none}
#stage.hidecursor{cursor:none}
#viz{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
.hud.hidden{opacity:0}
#label{
  position:absolute;top:22px;left:26px;
  color:#fff;mix-blend-mode:difference;
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;
}
#labelText{opacity:.72}
#seedTag{opacity:.38;margin-top:4px;font-size:10px;letter-spacing:.24em}
#fps{
  position:absolute;top:22px;right:26px;display:none;
  color:#fff;mix-blend-mode:difference;opacity:.6;
  font-size:11px;letter-spacing:.14em;font-variant-numeric:tabular-nums;
}
#controls{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;padding:8px;border-radius:999px;
  background:rgba(12,12,18,.42);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.09);
  pointer-events:auto;
}
.cbtn{
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  transition:background .15s,transform .15s;
}
.cbtn:hover{background:rgba(255,255,255,.13)}
.cbtn:active{transform:scale(.93)}
.cbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbtn svg .solid{fill:#fff;stroke:none}
#btnPlay{background:rgba(255,255,255,.10)}
</style>

<body>

<div id="menu">
  <div class="wrap">
    <h1>OSCILLO</h1>
    <p class="tag">A generative audio·visual instrument. Pick a sound and a mood —
    every note and every pixel is synthesized live in your browser. Nothing recorded, nothing loaded.</p>

    <div class="cols">
      <section>
        <h3>01 · Music style</h3>
        <button class="card" data-style="ambient"><b>Ambient / Atmospheric</b><span>weightless pads, endless space, no pulse</span></button>
        <button class="card" data-style="edm"><b>Electronic / EDM</b><span>four on the floor, arps, rising energy</span></button>
        <button class="card" data-style="orchestral"><b>Orchestral / Cinematic</b><span>swelling strings, distant drums, melody</span></button>
        <button class="card" data-style="lofi"><b>Lo-fi / Chill</b><span>dusty keys, lazy swing, warm and mellow</span></button>
      </section>
      <section>
        <h3>02 · Visual mood</h3>
        <button class="card" data-mood="neon"><b>Dark · Moody · Neon</b><span>glow trails and shockwaves in the void</span></button>
        <button class="card" data-mood="playful"><b>Bright · Colorful · Playful</b><span>bouncing shapes and confetti physics</span></button>
        <button class="card" data-mood="minimal"><b>Minimal · Monochrome · Clean</b><span>thin geometry, negative space</span></button>
        <button class="card" data-mood="organic"><b>Organic · Natural</b><span>smoke and water, drifting light</span></button>
      </section>
    </div>

    <div class="go">
      <button id="generate" disabled>GENERATE</button>
      <button id="lucky">or roll a random combination</button>
      <p class="hint">Space — play/pause · R — regenerate · F — fullscreen · Esc — menu</p>
    </div>
  </div>
</div>

<div id="stage" class="gone">
  <canvas id="viz"></canvas>
  <div class="hud" id="hud">
    <div id="label">
      <div id="labelText">—</div>
      <div id="seedTag">—</div>
    </div>
    <div id="fps"></div>
    <div id="controls">
      <button class="cbtn" id="btnMenu" title="Back to menu (Esc)">
        <svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg>
      </button>
      <button class="cbtn" id="btnPlay" title="Play / pause (Space)">
        <svg viewBox="0 0 24 24" id="icoPlay" style="display:none"><path class="solid" d="M8.5 5.5v13l11-6.5z"/></svg>
        <svg viewBox="0 0 24 24" id="icoPause"><path class="solid" d="M8 5.5h2.7v13H8zM13.3 5.5H16v13h-2.7z"/></svg>
      </button>

        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3.6v5h-5"/></svg>
      </button>
      <button class="cbtn" id="btnFull" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" id="icoExpand"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <svg viewBox="0 0 24 24" id="icoShrink" style="display:none"><path d="M4 9h5V4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   OSCILLO — generative audio·visual instrument.
   Single file, vanilla JS. All audio synthesized with Web Audio,
   all visuals drawn on canvas, driven by the live audio signal.
   ════════════════════════════════════════════════════════════════ */

/* ── utilities ─────────────────────────────────────── */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;

function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function makeRng(seed){
  const f=mulberry32(seed);
  return {
    f,
    range:(a,b)=>a+f()*(b-a),
    int:(a,b)=>a+Math.floor(f()*(b-a+1)),
    pick:arr=>arr[Math.floor(f()*arr.length)],
    chance:p=>f()<p,
    sign:()=>f()<0.5?-1:1,
  };
}

/* seeded 2D value noise + fbm (for organic flow fields) */
function makeNoise(seed){
  const r=mulberry32(seed);
  const perm=new Uint8Array(512), vals=new Float32Array(256);
  const p=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
  for(let i=0;i<256;i++)vals[i]=r()*2-1;
  function n2(x,y){
    const xi=Math.floor(x),yi=Math.floor(y);
    const xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const X=xi&255,Y=yi&255;
    const aa=vals[perm[(perm[X]+Y)&255]],   ba=vals[perm[(perm[(X+1)&255]+Y)&255]];
    const ab=vals[perm[(perm[X]+Y+1)&255]], bb=vals[perm[(perm[(X+1)&255]+Y+1)&255]];
    return lerp(lerp(aa,ba,u),lerp(ab,bb,u),v);
  }
  return {
    n2,
    fbm2:(x,y)=>n2(x,y)*0.65+n2(x*2.7+31.4,y*2.7+17.7)*0.35,
  };
}

/* ── music metadata ────────────────────────────────── */
const STYLE_META={
  ambient:   {label:"Ambient",    energy:0.22, beat:false},
  edm:       {label:"Electronic", energy:1.00, beat:true },
  orchestral:{label:"Orchestral", energy:0.62, beat:true },
  lofi:      {label:"Lo-fi",      energy:0.45, beat:true },
};
const MOOD_META={
  neon:    {label:"Dark Neon"},
  playful: {label:"Bright Playful"},
  minimal: {label:"Minimal Mono"},
  organic: {label:"Organic Natural"},
};
const mtof=m=>440*Math.pow(2,(m-69)/12);

/* ════════════════════════════════════════════════════
   AUDIO ENGINE (skeleton — style generators land next)
   ════════════════════════════════════════════════════ */
class AudioEngine{
  constructor(){
    this.ctx=null;
    this.running=false;
    this.paused=false;
    this.events=[];          // {t, type, ...} timestamped in audio-clock time
    this.gen=null;           // current style generator
    this.genNodes=[];        // nodes to disconnect on teardown
    this.sustained=[];       // sources that never self-stop
    this.generation=0;
    this.info={bpm:0,style:null};
    // analysis state
    this.f={level:0,bass:0,mid:0,treb:0};
    this.norm={level:.25,bass:.25,mid:.25,treb:.25};
  }

  ensureCtx(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    this.ctx=new AC();
    const c=this.ctx;
    // persistent master chain: styleAmp → comp → analyser → master → out
    this.styleAmp=c.createGain();
    this.comp=c.createDynamicsCompressor();
    this.comp.threshold.value=-18;this.comp.knee.value=12;
    this.comp.ratio.value=4;this.comp.attack.value=0.004;this.comp.release.value=0.22;
    this.analyser=c.createAnalyser();
    this.analyser.fftSize=2048;
    this.analyser.smoothingTimeConstant=0.5;
    this.master=c.createGain();this.master.gain.value=0.85;
    this.styleAmp.connect(this.comp).connect(this.analyser).connect(this.master).connect(c.destination);
    this.freqData=new Uint8Array(this.analyser.frequencyBinCount);
    this.timeData=new Uint8Array(this.analyser.fftSize);
    this.binHz=c.sampleRate/2/this.analyser.frequencyBinCount;
  }

  /* start a style. Generators are registered in AudioEngine.styles. */
  start(style,seed){
    this.ensureCtx();
    this.stop(true);
    const gen=this.generation=this.generation+1;
    this.ctx.resume();
    this.styleAmp.gain.cancelScheduledValues(0);
    this.styleAmp.gain.setValueAtTime(0.0001,this.ctx.currentTime);
    this.styleAmp.gain.linearRampToValueAtTime(1,this.ctx.currentTime+0.25);
    this.rng=makeRng(seed);
    this.events=[];
    this.info={bpm:0,style};
    const factory=AudioEngine.styles[style];
    this.gen=factory?factory(this,this.rng):null;
    this.stepIdx=0;
    this.nextTime=this.ctx.currentTime+0.12;
    this.running=true;
    this.paused=false;
    this.timer=setInterval(()=>this.tick(gen),80);
    this.tick(gen);
  }

  tick(gen){
    if(!this.running||gen!==this.generation||!this.gen) return;
    const lookahead=document.hidden?1.9:0.35;
    const limit=this.ctx.currentTime+lookahead;
    let guard=0;
    while(this.nextTime<limit&&guard++<600){
      this.gen.step(this.nextTime,this.stepIdx);
      this.nextTime+=this.gen.stepDur;
      this.stepIdx++;
    }
  }

  stop(fast){
    this.running=false;
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    if(this.styleAmp){
      this.styleAmp.gain.cancelScheduledValues(t);
      this.styleAmp.gain.setValueAtTime(this.styleAmp.gain.value,t);
      this.styleAmp.gain.linearRampToValueAtTime(0.0001,t+(fast?0.08:0.4));
    }
    const nodes=this.genNodes,sus=this.sustained;
    this.genNodes=[];this.sustained=[];
    setTimeout(()=>{
      for(const s of sus){try{s.stop();}catch(e){}}
      for(const n of nodes){try{n.disconnect();}catch(e){}}
    },fast?120:450);
    this.gen=null;
    this.events=[];
  }

  setPaused(p){
    if(!this.ctx) return;
    this.paused=p;
    if(p) this.ctx.suspend(); else this.ctx.resume();
  }

  /* per-frame feature extraction: adaptive-normalized band energies */
  frame(dt){
    const f=this.f;
    if(!this.ctx||this.paused||!this.running){
      const k=1-Math.exp(-dt*4);
      f.level=lerp(f.level,0,k);f.bass=lerp(f.bass,0,k);
      f.mid=lerp(f.mid,0,k);f.treb=lerp(f.treb,0,k);
      return f;
    }
    this.analyser.getByteFrequencyData(this.freqData);
    this.analyser.getByteTimeDomainData(this.timeData);
    const band=(lo,hi)=>{
      let a=Math.max(1,Math.floor(lo/this.binHz)),b=Math.min(this.freqData.length-1,Math.ceil(hi/this.binHz));
      let s=0;for(let i=a;i<=b;i++)s+=this.freqData[i];
      return s/((b-a+1)*255);
    };
    let rms=0;
    for(let i=0;i<this.timeData.length;i+=4){const v=(this.timeData[i]-128)/128;rms+=v*v;}
    rms=Math.sqrt(rms/(this.timeData.length/4));
    const raw={level:rms*1.6,bass:band(28,180),mid:band(200,2000),treb:band(2200,9000)};
    const decay=Math.pow(0.62,dt);            // normalizer relaxes ~0.6×/s
    for(const k in raw){
      this.norm[k]=Math.max(raw[k],this.norm[k]*decay,0.2);
      const v=clamp(raw[k]/this.norm[k],0,1);
      const rate=v>f[k]?22:6;                 // fast attack, slow release
      f[k]=lerp(f[k],v,1-Math.exp(-dt*rate));
    }
    return f;
  }

  /* hand due events (scheduled time reached in the audio clock) to visuals */
  takeEvents(){
    if(!this.ctx||this.events.length===0) return AudioEngine.EMPTY;
    const now=this.ctx.currentTime,out=[],keep=[];
    for(const e of this.events){
      if(e.t<=now){ if(e.t>now-0.3) out.push(e); }
      else keep.push(e);
    }
    this.events=keep;
    return out;
  }
}
AudioEngine.EMPTY=[];

/* ════════════════════════════════════════════════════
   AUDIO — shared voice toolkit
   ════════════════════════════════════════════════════ */
const SCALES={
  major:  [0,2,4,5,7,9,11],
  aeolian:[0,2,3,5,7,8,10],
  dorian: [0,2,3,5,7,9,10],
  lydian: [0,2,4,6,7,9,11],
  mixo:   [0,2,4,5,7,9,10],
};
function chordMidis(rootM,scale,deg,count){
  const out=[];
  for(let k=0;k<count;k++){
    const idx=deg+2*k;
    out.push(rootM+12*Math.floor(idx/scale.length)+scale[idx%scale.length]);
  }
  return out;
}

Object.assign(AudioEngine.prototype,{
  reg(n){this.genNodes.push(n);return n;},
  /* stop sources at tEnd, disconnect the voice graph when done */
  reap(sources,nodes,tEnd){
    for(const s of sources){try{s.stop(tEnd);}catch(e){}}
    sources[0].addEventListener("ended",()=>{
      for(const n of nodes){try{n.disconnect();}catch(e){}}
    });
  },
  osc(type,freq,det){const o=this.ctx.createOscillator();o.type=type;o.frequency.value=freq;if(det)o.detune.value=det;return o;},
  gainN(v){const g=this.ctx.createGain();g.gain.value=v;return g;},
  filt(type,freq,Q){const f=this.ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;if(Q!=null)f.Q.value=Q;return f;},
  env(g,t,{a=0.01,d=0,s=1,r=0.3,dur=0.1,peak=1}={}){
    const p=g.gain;
    p.setValueAtTime(0.0001,t);
    p.linearRampToValueAtTime(peak,t+a);
    if(d>0)p.linearRampToValueAtTime(peak*s,t+a+d);
    const hold=t+Math.max(dur,a+d);
    p.setValueAtTime(d>0?peak*s:peak,hold);
    p.linearRampToValueAtTime(0.0001,hold+r);
    return hold+r;
  },
  noiseBuf(){
    if(!this._nb){
      const c=this.ctx,len=(c.sampleRate*1.5)|0;
      const b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
      const r=mulberry32(0xBEEF11);
      for(let i=0;i<len;i++)d[i]=r()*2-1;
      this._nb=b;
    }
    return this._nb;
  },
  noiseSrc(loop){
    const s=this.ctx.createBufferSource();
    s.buffer=this.noiseBuf();s.loop=!!loop;
    return s;
  },
  /* procedural room: exponentially decaying noise burst as convolver IR */
  makeImpulse(sec,pow){
    const c=this.ctx,len=Math.max(64,(sec*c.sampleRate)|0);
    const b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){
      const d=b.getChannelData(ch),r=mulberry32(0xC0FFEE+ch*77);
      for(let i=0;i<len;i++)d[i]=(r()*2-1)*Math.pow(1-i/len,pow);
    }
    return b;
  },
  /* sparse dust impulses + faint hiss, looped (lo-fi vinyl bed) */
  crackleBuf(){
    if(!this._cb){
      const c=this.ctx,len=(c.sampleRate*2.2)|0;
      const b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
      const r=mulberry32(0xD057D057);
      for(let i=0;i<len;i++){
        let v=(r()*2-1)*0.012;                       // hiss floor
        if(r()<0.0011){v+=(r()*2-1)*Math.pow(r(),1.5)*1.2;} // dust tick
        d[i]=v;
      }
      this._cb=b;
    }
    return this._cb;
  },
  noiseHit(t,{dur=0.05,a=0.002,type="highpass",freq=8000,Q=0.7,vel=0.2,dest,send,sendV=0}){
    const s=this.noiseSrc(false),f=this.filt(type,freq,Q),g=this.gainN(0);
    s.connect(f);f.connect(g);g.connect(dest);
    const nodes=[f,g];
    if(send&&sendV>0){const sg=this.gainN(sendV);g.connect(sg);sg.connect(send);nodes.push(sg);}
    this.env(g,t,{a,dur:0.004,r:dur,peak:vel});
    s.start(t);this.reap([s],nodes,t+dur+0.15);
  },
  kick(t,{vel=1,f0=150,f1=48,pDec=0.09,dec=0.3,click=0,dest}){
    const o=this.osc("sine",f0),g=this.gainN(0);
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+pDec);
    o.connect(g);g.connect(dest);
    this.env(g,t,{a:0.003,dur:0.012,r:dec,peak:vel});
    o.start(t);this.reap([o],[g],t+dec+0.12);
    if(click>0)this.noiseHit(t,{dur:0.016,freq:2500,vel:click,dest});
    this.events.push({t,type:"kick",v:vel});
  },
});

/* ════════════════════════════════════════════════════
   AUDIO — style generators
   Each factory wires its own buses/effects and returns
   {stepDur, step(t, i)} for the lookahead scheduler.
   ════════════════════════════════════════════════════ */
AudioEngine.styles={};

/* ── AMBIENT: beatless — drone, slow pads, sparse FM bells ── */
AudioEngine.styles.ambient=function(E,r){
  const c=E.ctx,out=E.styleAmp;
  const bus=E.reg(E.gainN(1.25));bus.connect(out);
  const verb=E.reg(c.createConvolver());verb.buffer=E.makeImpulse(6.5,2.1);
  const vRet=E.reg(E.gainN(0.55));verb.connect(vRet);vRet.connect(out);
  const vSend=E.reg(E.gainN(1));vSend.connect(verb);
  const dly=E.reg(c.createDelay(2));dly.delayTime.value=r.range(0.38,0.5);
  const dlyFb=E.reg(E.gainN(0.5)),dlyLp=E.reg(E.filt("lowpass",2200,0.5)),dlyRet=E.reg(E.gainN(0.5));
  dly.connect(dlyLp);dlyLp.connect(dlyFb);dlyFb.connect(dly);dlyLp.connect(dlyRet);dlyRet.connect(bus);dlyLp.connect(vSend);

  const scale=SCALES[r.pick(["lydian","dorian","mixo"])];
  const rootM=r.int(43,50);
  const padWave=r.pick(["sawtooth","triangle"]);
  const pent=[scale[0],scale[1],scale[2],scale[4],scale[5]];
  const st={deg:0,nextChord:0,first:true};
  E.info.bpm=0;

  /* drone: sub sine + slow-filtered saw, alive via LFOs */
  {
    const f0=mtof(rootM-12);
    const o1=E.osc("sine",f0*0.5),g1=E.gainN(0.13);
    o1.connect(g1);g1.connect(bus);
    const o2=E.osc("sawtooth",f0),lp=E.filt("lowpass",320,0.7),g2=E.gainN(0.05);
    o2.connect(lp);lp.connect(g2);g2.connect(bus);g2.connect(vSend);
    const lfo=E.osc("sine",0.045),lg=E.gainN(140);
    lfo.connect(lg);lg.connect(lp.frequency);
    const lfo2=E.osc("sine",0.028),lg2=E.gainN(0.045);
    lfo2.connect(lg2);lg2.connect(g1.gain);
    o1.start();o2.start();lfo.start();lfo2.start();
    E.sustained.push(o1,o2,lfo,lfo2);E.reg(g1);E.reg(g2);E.reg(lp);E.reg(lg);E.reg(lg2);
  }
  /* wash: barely-there filtered noise tide */
  {
    const n=E.noiseSrc(true),lp=E.filt("lowpass",650,0.4),g=E.gainN(0.02);
    n.connect(lp);lp.connect(g);g.connect(vSend);
    const lfo=E.osc("sine",0.02),lg=E.gainN(0.012);
    lfo.connect(lg);lg.connect(g.gain);
    n.start();lfo.start();
    E.sustained.push(n,lfo);E.reg(lp);E.reg(g);E.reg(lg);
  }

  function padChord(t){
    const walk=[0,2,3,4,5];
    st.deg=r.pick(walk.filter(d=>d!==st.deg));
    const dur=r.range(11,17);
    const midis=chordMidis(rootM,scale,st.deg,r.chance(0.5)?5:4);
    const freqs=[];
    midis.forEach((m,i)=>{
      const f=mtof(m);freqs.push(f);
      const lp=E.filt("lowpass",r.range(420,700),0.6);
      const vg=E.gainN(0);
      lp.connect(vg);vg.connect(bus);
      const sg=E.gainN(0.5);vg.connect(sg);sg.connect(vSend);
      lp.frequency.setValueAtTime(lp.frequency.value,t);
      lp.frequency.linearRampToValueAtTime(r.range(1200,2100),t+dur*0.55);
      lp.frequency.linearRampToValueAtTime(500,t+dur*1.05);
      const srcs=[];
      for(const det of[-r.range(4,9),r.range(4,9)]){
        const o=E.osc(padWave,f,det);o.connect(lp);o.start(t);srcs.push(o);
      }
      if(i===0){const o=E.osc("sine",f*0.5);o.connect(lp);o.start(t);srcs.push(o);}
      const tEnd=E.env(vg,t,{a:dur*0.3,dur:dur*0.55,r:dur*0.5,peak:0.05});
      E.reap(srcs,[lp,vg,sg],tEnd+0.1);
    });
    E.events.push({t,type:"chord",freqs});
    st.nextChord=t+dur*r.range(0.8,0.95);
  }

  function bell(t){
    const m=rootM+24+r.pick(pent)+(r.chance(0.3)?12:0);
    const f=mtof(m);
    const car=E.osc("sine",f);
    const mod=E.osc("sine",f*r.pick([2.0,2.76,3.53]));
    const mg=E.gainN(f*1.4);
    mod.connect(mg);mg.connect(car.frequency);
    mg.gain.setValueAtTime(f*1.4,t);
    mg.gain.exponentialRampToValueAtTime(1,t+0.4);
    const dec=r.range(2.5,5),peak=r.range(0.08,0.2);
    const g=E.gainN(0);
    car.connect(g);g.connect(bus);
    const sg=E.gainN(0.7);g.connect(sg);sg.connect(vSend);
    const dg=E.gainN(0.5);g.connect(dg);dg.connect(dly);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(peak,t+0.007);
    g.gain.setTargetAtTime(0,t+0.007,dec/6);
    car.start(t);mod.start(t);
    E.reap([car,mod],[mg,g,sg,dg],t+dec);
    E.events.push({t,type:"note",freq:f,v:peak*5});
  }

  function bloom(t){
    const f=mtof(rootM-5+r.pick([0,7]));
    const o=E.osc("sine",f),g=E.gainN(0);
    o.connect(g);g.connect(bus);
    const sg=E.gainN(0.8);g.connect(sg);sg.connect(vSend);
    const tEnd=E.env(g,t,{a:3.5,dur:4,r:5,peak:0.09});
    o.start(t);E.reap([o],[g,sg],tEnd+0.1);
    E.events.push({t,type:"swell",v:1});
  }

  return{
    stepDur:0.5,
    step(t){
      if(st.first||t>=st.nextChord-0.01){st.first=false;padChord(t);}
      if(r.chance(0.11))bell(t+r.range(0,0.45));
      if(r.chance(0.014))bloom(t);
    },
  };
};

/* ── EDM: four-on-floor, arps, 8-bar sections that build & drop ── */
AudioEngine.styles.edm=function(E,r){
  const c=E.ctx,out=E.styleAmp;
  const bpm=r.int(124,132),spb=60/bpm,stepDur=spb/4;
  E.info.bpm=bpm;
  /* buses: kick+sub punch straight through; melodic bus gets sidechain pump */
  const dry=E.reg(E.gainN(0.78));dry.connect(out);
  const pump=E.reg(E.gainN(1));const pumped=E.reg(E.gainN(0.78));
  pump.connect(pumped);pumped.connect(out);
  const verb=E.reg(c.createConvolver());verb.buffer=E.makeImpulse(1.9,2.6);
  const vRet=E.reg(E.gainN(0.16));verb.connect(vRet);vRet.connect(pump);
  const vSend=E.reg(E.gainN(1));vSend.connect(verb);
  const dly=E.reg(c.createDelay(1));dly.delayTime.value=spb*0.75;
  const dlyFb=E.reg(E.gainN(0.42)),dlyHp=E.reg(E.filt("highpass",300,0.5)),dlyRet=E.reg(E.gainN(0.3));
  dly.connect(dlyHp);dlyHp.connect(dlyFb);dlyFb.connect(dly);dlyHp.connect(dlyRet);dlyRet.connect(pump);
  const color=E.reg(E.filt("lowpass",700,0.9));color.connect(pump);

  const scale=SCALES.aeolian;
  const rootM=r.int(45,50);
  const prog=r.pick([[0,5,3,4],[0,3,5,4],[0,5,1,4],[0,6,5,4]]);
  const arpPat=[];
  {
    const kind=r.pick(["up","updown","riff"]);
    for(let i=0;i<16;i++){
      if(kind==="up")arpPat.push(i%8);
      else if(kind==="updown"){const j=i%14;arpPat.push(j<8?j:14-j);}
      else arpPat.push(r.int(0,7));
    }
  }
  const bassPat=r.pick([[0,0,12,0,0,12,0,12],[0,12,0,0,12,0,0,12],[0,0,0,12,0,0,12,0]]);
  const SEQ=["intro","build","drop","drop","break","build","drop","drop"];
  const secOf=si=>si===0?"intro":SEQ[1+(si-1)%(SEQ.length-1)];
  let lastSec=null;

  function duck(t){
    pump.gain.cancelScheduledValues(t);
    pump.gain.setValueAtTime(0.35,t);
    pump.gain.linearRampToValueAtTime(1,t+spb*0.72);
  }
  function bassNote(t,deg,oct){
    let m=rootM+scale[deg]-24+oct;while(m<26)m+=12;while(m>44)m-=12;
    const o=E.osc("sawtooth",mtof(m)),lp=E.filt("lowpass",480,1.1),g=E.gainN(0);
    lp.frequency.setValueAtTime(900,t);
    lp.frequency.exponentialRampToValueAtTime(340,t+0.14);
    o.connect(lp);lp.connect(g);g.connect(pump);
    const tEnd=E.env(g,t,{a:0.004,dur:stepDur*1.6,r:0.07,peak:0.3});
    o.start(t);E.reap([o],[lp,g],tEnd+0.05);
  }
  function sub(t,deg){
    let m=rootM+scale[deg]-24;while(m<26)m+=12;
    const o=E.osc("sine",mtof(m-12<24?m:m-12)),g=E.gainN(0);
    o.connect(g);g.connect(dry);
    const tEnd=E.env(g,t,{a:0.005,dur:0.05,r:0.3,peak:0.5});
    o.start(t);E.reap([o],[g],tEnd+0.05);
  }
  function arpNote(t,deg,idx,vel){
    const pool=chordMidis(rootM+12,scale,deg,4);
    pool.push(...pool.map(m=>m+12));
    const m=pool[idx%pool.length],f=mtof(m);
    const g=E.gainN(0);
    const srcs=[];
    for(const det of[-8,8]){const o=E.osc("sawtooth",f,det);o.connect(g);o.start(t);srcs.push(o);}
    g.connect(color);
    const dg=E.gainN(0.33);g.connect(dg);dg.connect(dly);
    const sg=E.gainN(0.2);g.connect(sg);sg.connect(vSend);
    const tEnd=E.env(g,t,{a:0.003,dur:0.02,r:0.15,peak:0.13*vel});
    E.reap(srcs,[g,dg,sg],tEnd+0.05);
    E.events.push({t,type:"note",freq:f,v:vel});
  }
  function stab(t,deg){
    const midis=chordMidis(rootM+12,scale,deg,4);
    const g=E.gainN(0);g.connect(color);
    const sg=E.gainN(0.4);g.connect(sg);sg.connect(vSend);
    const srcs=[];
    for(const m of midis){
      const o=E.osc("sawtooth",mtof(m),r.range(-7,7));o.connect(g);o.start(t);srcs.push(o);
    }
    const tEnd=E.env(g,t,{a:0.004,dur:0.05,r:0.28,peak:0.18});
    E.reap(srcs,[g,sg],tEnd+0.05);
  }
  function breakPad(t,deg,dur){
    const midis=chordMidis(rootM+12,scale,deg,4);
    const g=E.gainN(0);g.connect(color);
    const sg=E.gainN(0.5);g.connect(sg);sg.connect(vSend);
    const srcs=[];
    for(const m of midis){
      for(const det of[-6,6]){const o=E.osc("sawtooth",mtof(m),det);o.connect(g);o.start(t);srcs.push(o);}
    }
    const tEnd=E.env(g,t,{a:dur*0.3,dur:dur*0.8,r:dur*0.35,peak:0.05});
    E.reap(srcs,[g,sg],tEnd+0.05);
    E.events.push({t,type:"chord"});
  }
  function riser(t,dur){
    const n=E.noiseSrc(true),bp=E.filt("bandpass",500,1.4),g=E.gainN(0);
    n.connect(bp);bp.connect(g);g.connect(pump);
    bp.frequency.setValueAtTime(500,t);
    bp.frequency.exponentialRampToValueAtTime(5800,t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.2,t+dur);
    g.gain.linearRampToValueAtTime(0,t+dur+0.03);
    n.start(t);E.reap([n],[bp,g],t+dur+0.1);
    E.events.push({t,type:"riser",dur});
  }
  function crash(t){
    E.noiseHit(t,{dur:0.9,freq:4500,vel:0.32,dest:pump,send:vSend,sendV:0.6});
  }

  return{
    stepDur,
    step(t,i){
      const sb=i%16,bar=(i/16)|0,bis=bar%8,si=(bar/8)|0;
      const sec=secOf(si);
      const deg=prog[bar%4];
      if(sb===0&&bis===0){
        /* section boundary: retune the color filter + tell the visuals */
        const fq=color.frequency,secDur=spb*4*8;
        fq.cancelScheduledValues(t);
        if(sec==="intro")fq.setValueAtTime(750,t);
        else if(sec==="build"){fq.setValueAtTime(900,t);fq.exponentialRampToValueAtTime(6200,t+secDur);}
        else if(sec==="drop")fq.setValueAtTime(7500,t);
        else{fq.setValueAtTime(Math.max(500,fq.value||900),t);fq.exponentialRampToValueAtTime(900,t+spb*2);}
        if(sec!==lastSec){E.events.push({t,type:"section",name:sec});lastSec=sec;}
        if(sec==="drop")crash(t);
      }
      const hasKick=sec==="intro"||sec==="build"||sec==="drop";
      if(hasKick&&sb%4===0){
        E.kick(t,{vel:sec==="drop"?1:0.85,click:sec==="drop"?0.22:0.1,dest:dry});
        duck(t);
        if(sec==="drop")sub(t,deg);
      }
      if(sb%2===0&&sec!=="break"){
        if(!(sec==="drop"&&sb===0))bassNote(t,deg,bassPat[(sb/2)|0]);
      }else if(sec==="break"&&sb===0){
        bassNote(t,deg,0);
      }
      if(sec==="break"&&sb===0)breakPad(t,deg,spb*4);
      if(sec!=="intro"&&sec!=="break"){
        const open=sec==="drop"&&sb%4===2;
        if(open)E.noiseHit(t,{dur:0.22,freq:7000,vel:0.22,dest:pump});
        else E.noiseHit(t,{dur:r.range(0.03,0.05),freq:8200,vel:sb%4===2?0.16:0.08,dest:pump});
      }
      if(sec!=="intro"){
        const vel=sb%4===0?1:0.7;
        arpNote(t,deg,arpPat[sb],vel*(sec==="break"?0.7:1));
      }
      if(sec==="drop"&&(sb===4||sb===12)){
        for(let k=0;k<3;k++)E.noiseHit(t+k*0.012,{dur:k===2?0.18:0.03,type:"bandpass",freq:1500,Q:1,vel:0.2,dest:pump,send:vSend,sendV:0.5});
        E.events.push({t,type:"snare",v:1});
      }
      if(sec==="drop"&&sb===0)stab(t,deg);
      if(sec==="build"){
        if(bis===6&&sb===0)riser(t,spb*8);
        if(bis===7)E.noiseHit(t,{dur:0.05,type:"bandpass",freq:1600,Q:1,vel:0.06+0.24*(sb/16),dest:pump});
      }
    },
  };
};

/* ── ORCHESTRAL: string swells, phrase melody, timpani ── */
AudioEngine.styles.orchestral=function(E,r){
  const c=E.ctx,out=E.styleAmp;
  const bpm=r.int(70,86),spb=60/bpm,stepDur=spb/2,barDur=spb*4;
  E.info.bpm=bpm;
  const swell=E.reg(E.gainN(0.7));
  const bus=E.reg(E.gainN(0.95));swell.connect(bus);bus.connect(out);
  const verb=E.reg(c.createConvolver());verb.buffer=E.makeImpulse(4.2,2.3);
  const vRet=E.reg(E.gainN(0.4));verb.connect(vRet);vRet.connect(out);
  const vSend=E.reg(E.gainN(1));vSend.connect(verb);

  const maj=r.chance(0.35);
  const scale=maj?SCALES.major:SCALES.aeolian;
  const rootM=r.int(45,52);
  const prog=r.pick(maj?[[0,5,3,4],[0,3,5,4],[0,4,5,3]]:[[0,5,2,6],[0,3,5,4],[0,5,3,4],[0,6,5,3]]);
  const melWalk=[0,1,2,4,5];
  let melodyPlan=null,melBase=rootM+24,melDeg=2;

  function stringChord(t,deg){
    const midis=chordMidis(rootM,scale,deg,4);
    midis.push(midis[0]+12);
    const vib=E.osc("sine",r.range(4.3,5.3)),vg=E.gainN(0);
    vib.connect(vg);
    vg.gain.setValueAtTime(0,t);
    vg.gain.linearRampToValueAtTime(6,t+1.4);
    vib.start(t);
    const dur=barDur*1.02,nodes=[vg],srcs=[vib];
    midis.forEach((m,i)=>{
      const f=mtof(m);
      const lp=E.filt("lowpass",1500,0.5),g=E.gainN(0);
      lp.connect(g);g.connect(swell);
      const sg=E.gainN(0.45);g.connect(sg);sg.connect(vSend);
      for(const det of[-r.range(5,9),0,r.range(5,9)]){
        const o=E.osc("sawtooth",f,det);
        vg.connect(o.detune);
        o.connect(lp);o.start(t);srcs.push(o);
      }
      nodes.push(lp,g,sg);
      E.env(g,t,{a:r.range(0.6,1.1),dur:dur*0.9,r:1.5,peak:0.042});
    });
    /* low octave root for weight */
    {
      const f=mtof(midis[0]-12);
      const lp=E.filt("lowpass",620,0.5),g=E.gainN(0);
      const o=E.osc("sawtooth",f);o.connect(lp);lp.connect(g);g.connect(swell);o.start(t);
      srcs.push(o);nodes.push(lp,g);
      E.env(g,t,{a:0.7,dur:dur*0.9,r:1.4,peak:0.09});
    }
    E.reap(srcs,nodes,t+dur+1.8);
    E.events.push({t,type:"chord"});
  }

  function melodyNote(t,m,dur){
    const f=mtof(m);
    const vib=E.osc("sine",5),vg=E.gainN(0);
    vib.connect(vg);
    vg.gain.setValueAtTime(0,t);
    vg.gain.linearRampToValueAtTime(9,t+Math.min(0.5,dur*0.5));
    const lp=E.filt("lowpass",2300,0.6),g=E.gainN(0);
    lp.connect(g);g.connect(swell);
    const sg=E.gainN(0.5);g.connect(sg);sg.connect(vSend);
    const o1=E.osc("sawtooth",f),o2=E.osc("triangle",f,4);
    vg.connect(o1.detune);vg.connect(o2.detune);
    o1.connect(lp);o2.connect(lp);
    const tEnd=E.env(g,t,{a:0.13,dur:dur*0.92,r:0.4,peak:0.13});
    o1.start(t);o2.start(t);vib.start(t);
    E.reap([o1,o2,vib],[vg,lp,g,sg],tEnd+0.1);
    E.events.push({t,type:"note",freq:f,v:1});
  }

  function timpani(t,vel){
    const f=mtof(rootM-12);
    const o=E.osc("sine",f*1.4),g=E.gainN(0);
    o.frequency.setValueAtTime(f*1.4,t);
    o.frequency.exponentialRampToValueAtTime(f,t+0.07);
    o.connect(g);g.connect(out);
    const sg=E.gainN(0.5);g.connect(sg);sg.connect(vSend);
    E.env(g,t,{a:0.004,dur:0.03,r:0.85,peak:0.55*vel});
    o.start(t);E.reap([o],[g,sg],t+1.1);
    E.noiseHit(t,{dur:0.14,type:"lowpass",freq:260,vel:0.3*vel,dest:out});
    E.events.push({t,type:"hit",v:vel});
  }

  function cymbalSwell(t,dur){
    const n=E.noiseSrc(true),hp=E.filt("highpass",3200,0.6),g=E.gainN(0);
    n.connect(hp);hp.connect(g);g.connect(bus);
    hp.frequency.setValueAtTime(3200,t);
    hp.frequency.exponentialRampToValueAtTime(6800,t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.13,t+dur);
    g.gain.linearRampToValueAtTime(0.0001,t+dur+0.55);
    const sg=E.gainN(0.6);g.connect(sg);sg.connect(vSend);
    n.start(t);E.reap([n],[hp,g,sg],t+dur+0.7);
    E.events.push({t,type:"swell",v:1});
  }

  function harpRun(t,deg){
    const midis=chordMidis(rootM+12,scale,deg,4);
    midis.push(...midis.map(m=>m+12));
    midis.slice(0,6).forEach((m,k)=>{
      const tt=t+k*0.055,f=mtof(m);
      const o=E.osc("triangle",f),g=E.gainN(0);
      o.connect(g);g.connect(bus);
      const sg=E.gainN(0.6);g.connect(sg);sg.connect(vSend);
      g.gain.setValueAtTime(0,tt);
      g.gain.linearRampToValueAtTime(0.09,tt+0.005);
      g.gain.setTargetAtTime(0,tt+0.005,0.28);
      o.start(tt);E.reap([o],[g,sg],tt+1.4);
      E.events.push({t:tt,type:"note",freq:f,v:0.5});
    });
  }

  function planPhrase(){
    melodyPlan=new Map();
    let pos=r.pick([0,1,2]);
    while(pos<26){
      const durSteps=r.pick([2,2,3,4,4,6]);
      if(!r.chance(0.22)){
        melDeg=clamp(melDeg+r.pick([-2,-1,-1,1,1,2]),0,melWalk.length-1);
        const m=melBase+scale[melWalk[melDeg]]+(r.chance(0.12)?12:0);
        melodyPlan.set(pos,{m,dur:durSteps*stepDur});
      }
      pos+=durSteps;
    }
  }

  return{
    stepDur,
    step(t,i){
      const sb=i%8,bar=(i/8)|0,bip=bar%4;
      const deg=prog[bar%4];
      if(sb===0&&bip===0){
        /* phrase downbeat: dynamic arc + percussion + fresh melody plan */
        swell.gain.cancelScheduledValues(t);
        swell.gain.setValueAtTime(0.55,t);
        swell.gain.linearRampToValueAtTime(1,t+barDur*2.6);
        swell.gain.linearRampToValueAtTime(0.6,t+barDur*4);
        timpani(t,1);
        if(r.chance(0.3))harpRun(t,deg);
        planPhrase();
      }
      if(sb===0)stringChord(t,deg);
      if(sb===0&&bip===2&&r.chance(0.4))timpani(t,0.6);
      if(sb===7&&bip===3&&r.chance(0.35))timpani(t+stepDur*0.5,0.5);
      if(sb===0&&bip===3&&r.chance(0.5))cymbalSwell(t,barDur*0.95);
      if(melodyPlan){
        const pip=bar%4*8+sb;
        const ev=melodyPlan.get(pip);
        if(ev)melodyNote(t,ev.m,ev.dur);
      }
    },
  };
};

/* ── LO-FI: swung dusty beat, warm keys, mellow bass ── */
AudioEngine.styles.lofi=function(E,r){
  const c=E.ctx,out=E.styleAmp;
  const bpm=r.int(74,84),spb=60/bpm,stepDur=spb/4;
  const swingShift=(r.range(0.54,0.6)-0.5)*spb;
  E.info.bpm=bpm;
  const bus=E.reg(E.gainN(1));bus.connect(out);
  const warm=E.reg(E.filt("lowpass",3800,0.4));warm.connect(bus);
  const verb=E.reg(c.createConvolver());verb.buffer=E.makeImpulse(1.4,2.8);
  const vRet=E.reg(E.gainN(0.22));verb.connect(vRet);vRet.connect(bus);
  const vSend=E.reg(E.gainN(1));vSend.connect(verb);

  const scale=SCALES.major;
  const rootM=r.int(48,55);
  const prog=r.pick([[1,4,0,5],[0,5,1,4],[3,2,1,0],[0,2,3,4]]);
  const kickPat=r.pick([[0,10],[0,6,10],[0,7,10],[0,10,14]]);
  const rechordAt=r.pick([10,11,8]);
  const pent=[0,2,4,7,9];

  /* vinyl bed */
  {
    const s=c.createBufferSource();s.buffer=E.crackleBuf();s.loop=true;
    const lp=E.filt("lowpass",5200,0.5),g=E.gainN(r.range(0.5,0.9));
    s.connect(lp);lp.connect(g);g.connect(bus);
    s.start();E.sustained.push(s);E.reg(lp);E.reg(g);
  }
  function keysChord(t,deg,dur,vel){
    const midis=chordMidis(rootM,scale,deg,4);
    if(r.chance(0.55))midis.push(rootM+12*Math.floor((deg+8)/7)+scale[(deg+8)%7]);
    /* per-chord filter wobble = tape drift feel */
    const wob=E.osc("sine",r.range(0.3,0.5)),wg=E.gainN(70);
    wob.connect(wg);wob.start(t);
    const freqs=[];
    let off=0,lastEnd=t;
    for(const m of midis){
      const f=mtof(m);freqs.push(f);
      const tt=t+off;off+=r.range(0.012,0.026);
      const lp=E.filt("lowpass",r.range(950,1400),0.7);
      wg.connect(lp.frequency);
      const g=E.gainN(0);
      lp.connect(g);g.connect(warm);
      const sg=E.gainN(0.5);g.connect(sg);sg.connect(vSend);
      const o1=E.osc("triangle",f),o2=E.osc("sine",f*2),h=E.gainN(0.22);
      o1.connect(lp);o2.connect(h);h.connect(lp);
      const tEnd=E.env(g,tt,{a:0.012,d:0.5,s:0.45,r:0.7,dur,peak:0.11*vel*r.range(0.85,1.1)});
      o1.start(tt);o2.start(tt);
      lastEnd=Math.max(lastEnd,tEnd);
      E.reap([o1,o2],[lp,g,sg,h],tEnd+0.1);
    }
    E.reap([wob],[wg],lastEnd+0.15);
    E.events.push({t,type:"chord",freqs});
  }
  function bassNote(t,deg,dur,fifth){
    let m=rootM+scale[deg]-12+(fifth?7:0);
    while(m>48)m-=12;while(m<33)m+=12;
    const o1=E.osc("sine",mtof(m)),o2=E.osc("triangle",mtof(m)),h=E.gainN(0.35);
    const lp=E.filt("lowpass",380,0.6),g=E.gainN(0);
    o1.connect(lp);o2.connect(h);h.connect(lp);lp.connect(g);g.connect(bus);
    const tEnd=E.env(g,t,{a:0.012,dur,r:0.22,peak:0.3});
    o1.start(t);o2.start(t);
    E.reap([o1,o2],[h,lp,g],tEnd+0.05);
  }
  function lick(t,step){
    const m=rootM+12+r.pick(pent)+(r.chance(0.25)?12:0);
    const f=mtof(m);
    const o=E.osc("triangle",f),lp=E.filt("lowpass",1700,0.7),g=E.gainN(0);
    o.connect(lp);lp.connect(g);g.connect(warm);
    const sg=E.gainN(0.5);g.connect(sg);sg.connect(vSend);
    const tEnd=E.env(g,t,{a:0.015,dur:spb*r.pick([0.4,0.6,0.9]),r:0.3,peak:0.1});
    o.start(t);E.reap([o],[lp,g,sg],tEnd+0.05);
    E.events.push({t,type:"note",freq:f,v:0.6});
  }
  let lickPlan=null;

  return{
    stepDur,
    step(t,i){
      const sb=i%16,bar=(i/16)|0;
      const deg=prog[bar%4];
      /* swing: delay the offbeat 8th (and its 16th) */
      if(sb%4===2||sb%4===3)t+=swingShift;
      if(sb===0){
        keysChord(t,deg,spb*2.4,1);
        bassNote(t,deg,spb*1.3,false);
        lickPlan=null;
        if(r.chance(0.4)){
          lickPlan=new Set();
          let p=r.pick([4,6,8]);
          const n=r.int(2,4);
          for(let k=0;k<n&&p<16;k++){lickPlan.add(p);p+=r.pick([2,2,3,4]);}
        }
      }
      if(sb===rechordAt&&r.chance(0.75))keysChord(t,deg,spb*1.4,0.75);
      if(sb===10)bassNote(t,deg,spb*0.9,r.chance(0.4));
      if(sb===15&&r.chance(0.25))bassNote(t,deg===prog[3]?0:deg,spb*0.4,true);
      if(kickPat.includes(sb)){
        E.kick(t,{vel:sb===0?0.85:0.7,f0:105,f1:46,dec:0.17,dest:bus});
      }
      if(sb===4||sb===12){
        E.noiseHit(t,{dur:0.12,type:"bandpass",freq:1600,Q:1.1,vel:0.26,dest:bus,send:vSend,sendV:0.5});
        E.noiseHit(t,{dur:0.03,type:"lowpass",freq:420,vel:0.18,dest:bus});
        E.events.push({t,type:"snare",v:1});
      }
      if(sb===7&&r.chance(0.18))E.noiseHit(t,{dur:0.05,type:"bandpass",freq:1500,Q:1,vel:0.07,dest:bus});
      if(sb%2===0){
        const open=sb===14&&r.chance(0.3);
        E.noiseHit(t+r.range(-0.004,0.004),{
          dur:open?0.18:r.range(0.02,0.045),
          freq:7600,vel:open?0.11:(sb%4===2?0.09:0.05)*r.range(0.7,1.2),dest:bus});
      }
      if(lickPlan&&lickPlan.has(sb))lick(t,sb);
    },
  };
};

/* ════════════════════════════════════════════════════
   VISUAL ENGINE (skeleton — mood renderers land next)
   ════════════════════════════════════════════════════ */
class VisualEngine{
  constructor(canvas){
    this.cv=canvas;
    this.g=canvas.getContext("2d");
    this.mode=null;
    this.W=0;this.H=0;this.dpr=1;
    this.quality=1;
    this.t=0;
    addEventListener("resize",()=>this.fit());
    this.fit();
  }
  fit(){
    const w=innerWidth,h=innerHeight;
    const d=Math.min(devicePixelRatio||1,1.6);
    this.W=w;this.H=h;this.dpr=d;
    this.cv.width=Math.round(w*d);
    this.cv.height=Math.round(h*d);
    this.g.setTransform(d,0,0,d,0,0);
    if(this.mode&&this.mode.resize)this.mode.resize(w,h);
    if(this.mode)this.clearTo(this.mode.bg||"#000");
  }
  clearTo(color){
    this.g.save();
    this.g.setTransform(1,0,0,1,0,0);
    this.g.globalCompositeOperation="source-over";
    this.g.fillStyle=color;
    this.g.fillRect(0,0,this.cv.width,this.cv.height);
    this.g.restore();
  }
  start(mood,music,seed){
    this.t=0;
    const factory=VisualEngine.modes[mood];
    this.mode=factory?factory(this,makeRng(seed),music):null;
    if(this.mode)this.clearTo(this.mode.bg||"#000");
  }
  stop(){this.mode=null;}
  frame(dt,f,events){
    if(!this.mode)return;
    this.t+=dt;
    this.mode.frame(dt,f,events,this.t);
  }
}
VisualEngine.modes={}; // filled in by the mood renderer section

/* ════════════════════════════════════════════════════
   APP — screens, selection state, transport, HUD
   ════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
const els={
  menu:$("menu"),stage:$("stage"),hud:$("hud"),
  label:$("labelText"),seed:$("seedTag"),fps:$("fps"),
  gen:$("generate"),lucky:$("lucky"),
  play:$("btnPlay"),regen:$("btnRegen"),full:$("btnFull"),back:$("btnMenu"),
  icoPlay:$("icoPlay"),icoPause:$("icoPause"),
  icoExpand:$("icoExpand"),icoShrink:$("icoShrink"),
};

const audio=new AudioEngine();
const viz=new VisualEngine($("viz"));

const app={
  style:null,mood:null,seed:0,
  active:false,playing:false,raf:0,
  showFps:false,
  frameEma:16.7,fpsAccum:0,fpsCount:0,fpsClock:0,
  lastTs:0,
};

/* selection cards */
for(const card of document.querySelectorAll(".card")){
  card.addEventListener("click",()=>{
    const kind=card.dataset.style?"style":"mood";
    app[kind]=card.dataset[kind];
    for(const c of document.querySelectorAll(`.card[data-${kind}]`))c.classList.toggle("sel",c===card);
    els.gen.disabled=!(app.style&&app.mood);
  });
}
els.lucky.addEventListener("click",()=>{
  const styles=Object.keys(STYLE_META),moods=Object.keys(MOOD_META);
  const s=styles[Math.floor(Math.random()*styles.length)];
  const m=moods[Math.floor(Math.random()*moods.length)];
  document.querySelector(`.card[data-style="${s}"]`).click();
  document.querySelector(`.card[data-mood="${m}"]`).click();
  begin();
});
els.gen.addEventListener("click",()=>{ if(app.style&&app.mood) begin(); });

function newSeed(){return (Math.random()*0xffffffff)>>>0;}

function begin(seed){
  app.seed=seed>>>0||newSeed();
  audio.start(app.style,app.seed);
  const meta=STYLE_META[app.style];
  viz.start(app.mood,{name:app.style,energy:meta.energy,beat:meta.beat,bpm:audio.info.bpm},(app.seed^0x9e3779b9)>>>0);
  els.label.textContent=`${meta.label} · ${MOOD_META[app.mood].label}`;
  els.seed.textContent="seed "+app.seed.toString(16).padStart(8,"0");
  els.menu.classList.add("gone");
  els.stage.classList.remove("gone");
  app.active=true;app.playing=true;
  setPlayIcon(true);
  pokeHud();
  if(!app.raf){app.lastTs=performance.now();app.raf=requestAnimationFrame(loop);}
}

function setPlayIcon(playing){
  els.icoPlay.style.display=playing?"none":"";
  els.icoPause.style.display=playing?"":"none";
}
function togglePlay(){
  if(!app.active)return;
  app.playing=!app.playing;
  audio.setPaused(!app.playing);
  setPlayIcon(app.playing);
  pokeHud();
}
function regenerate(){
  if(!app.active)return;
  if(!app.playing){app.playing=true;audio.setPaused(false);setPlayIcon(true);}
  begin();
}
function toMenu(){
  app.active=false;app.playing=false;
  audio.stop(false);
  viz.stop();
  els.stage.classList.add("gone");
  els.menu.classList.remove("gone");
  els.stage.classList.remove("hidecursor");
}
els.play.addEventListener("click",togglePlay);
els.regen.addEventListener("click",()=>regenerate());
els.back.addEventListener("click",toMenu);

/* fullscreen */
function toggleFull(){
  if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}
  else{document.documentElement.requestFullscreen().catch(()=>{});}
}
els.full.addEventListener("click",toggleFull);
document.addEventListener("fullscreenchange",()=>{
  const fs=!!document.fullscreenElement;
  els.icoExpand.style.display=fs?"none":"";
  els.icoShrink.style.display=fs?"":"none";
});

/* keyboard */
addEventListener("keydown",e=>{
  if(e.repeat)return;
  if(e.code==="Space"&&app.active){e.preventDefault();togglePlay();}
  else if(e.code==="KeyR"&&app.active)regenerate();
  else if(e.code==="KeyF"&&app.active)toggleFull();
  else if(e.code==="KeyD"&&app.active){app.showFps=!app.showFps;els.fps.style.display=app.showFps?"block":"none";}
  else if(e.code==="Escape"&&app.active&&!document.fullscreenElement)toMenu();
});

/* HUD auto-hide */
let hudTimer=0;
function pokeHud(){
  els.hud.classList.remove("hidden");
  els.stage.classList.remove("hidecursor");
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>{
    if(app.active&&app.playing){
      els.hud.classList.add("hidden");
      els.stage.classList.add("hidecursor");
    }
  },3200);
}
for(const ev of["mousemove","pointerdown","touchstart"])
  els.stage.addEventListener(ev,pokeHud,{passive:true});

/* main loop: audio features + due events drive the visuals */
function loop(ts){
  if(!app.active){app.raf=0;return;}
  const dt=clamp((ts-app.lastTs)/1000,0.001,0.05);
  app.lastTs=ts;
  const f=audio.frame(dt);
  const evs=app.playing?audio.takeEvents():AudioEngine.EMPTY;
  viz.frame(dt,f,evs);
  /* fps meter + adaptive quality */
  app.frameEma=lerp(app.frameEma,dt*1000,0.05);
  app.fpsClock+=dt;app.fpsCount++;
  if(app.fpsClock>=0.5){
    if(app.showFps)els.fps.textContent=`${Math.round(1000/app.frameEma)} fps`;
    app.fpsClock=0;app.fpsCount=0;
  }
  if(app.frameEma>21&&viz.quality>0.55){
    viz.quality*=0.8;app.frameEma=16.7;
    if(viz.mode&&viz.mode.applyQuality)viz.mode.applyQuality(viz.quality);
  }
  app.raf=requestAnimationFrame(loop);
}

/* debug handle for console-driven testing */
window.OSC={app,audio,viz,begin,
  debug(style,mood,seed){
    app.style=style;app.mood=mood;
    begin(seed);
  },
};
</script>
</body>
</html>
